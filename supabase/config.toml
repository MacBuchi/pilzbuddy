# Lokaler Supabase-Stack — nur für den CI-Job „Schema Dry Run" (und
# denselben Ablauf von Hand, siehe .github/workflows/ci.yml). Die Produktion
# wird davon nicht berührt; sie wird weiter über tool/db_migrate.sh +
# supabase/patch_NNN_*.sql migriert.
#
# Bewusst minimal: nur Datenbank, Auth und PostgREST. schema.sql braucht
# Auth zwingend (references auth.users, auth.uid() in Policies, Trigger auf
# auth.users) — alles andere kostet auf dem CI-Runner nur Startzeit.
project_id = "PilzBuddy"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
# Wie das Live-Projekt (Bestandsprojekt, Legacy-Verhalten): Tabellen im
# public-Schema sind ohne explizite Grants über die API erreichbar. Ohne
# diese Zeile prüft der Dry Run strengere Regeln als die Produktion und
# schlägt an Stellen fehl, die live funktionieren. Das Feld fällt am
# 2026-10-30 weg — bis dahin gehören explizite Grants in schema.sql,
# dann kann die Zeile raus.
auto_expose_new_tables = true

[db]
port = 54322
# Wie die Live-DB (Server 17.x) — sonst prüft der Dry Run ein anderes Postgres.
major_version = 17

[db.pooler]
enabled = false

[auth]
enabled = true
# Der Dry Run legt keine Nutzer an, aber GoTrue muss das auth-Schema
# anlegen, damit schema.sql durchläuft.
site_url = "http://127.0.0.1:3000"

# Mailpit fängt die Auth-Mails lokal ab (Web-UI und REST-API unter diesem
# Port) — damit ist „Passwort vergessen" komplett ohne Brevo prüfbar:
# Mail abholen, Code auslesen, einlösen. Der Dry Run selbst braucht das
# nicht, kostet aber nur wenige Sekunden Startzeit.
[local_smtp]
enabled = true
port = 54324

# Spiegelt die Härtung im Dashboard, damit lokal nicht laxer geprüft wird
# als in Produktion — genau solcher Drift bleibt sonst unbemerkt.
[auth.email]
# Wie live: Passwort-Änderungen verlangen eine frische Anmeldung. Der
# Reset-Flow lebt davon, dass die eben per Code eingelöste Sitzung als
# frisch gilt — mit dieser Zeile beweist der lokale Lauf das mit.
secure_password_change = true
# So, wie es nach dem Umschalten im Dashboard live ist (Reihenfolge in
# CLAUDE.md: erst diese Version ausliefern, dann Vorlage, dann Schalter).
# Bis dahin prüft CI hier bewusst den Zielzustand — die App beherrscht
# beide Einstellungen, weil `signUp` zurückgibt, ob bestätigt werden muss.
# Warum überhaupt: Sonst entstehen Konten auf Adressen, die niemand liest —
# der Reset-Code kann sie nie erreichen, und unzustellbare Mails schlagen
# als Hard Bounce auf die Absender-Reputation bei Brevo.
enable_confirmations = true
# Wie live („Secure email change", Dashboard-Default): Eine neue Adresse
# braucht Codes aus BEIDEN Postfächern — ein gestohlenes Session-Token
# allein kann das Konto nicht auf eine fremde Adresse umziehen.
double_confirm_changes = true

# Dieselbe Vorlage wie im Dashboard (versionierte Kopie, siehe die Datei):
# Code statt Link. Ohne diesen Block verschickt der lokale Stack GoTrues
# englische Standard-Mail mit Link — dann prüft man lokal etwas anderes.
[auth.email.template.confirmation]
subject = "PilzBuddy: Bitte bestätige deine Adresse"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "PilzBuddy: Code zum Zurücksetzen"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "PilzBuddy: Code für die neue Adresse"
content_path = "./supabase/templates/email_change.html"

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = true

# send-push prüft seine beiden Aufrufer SELBST (#277): Der Versand-Job
# weist sich mit `x-push-secret` aus und hat gar kein JWT — mit
# `verify_jwt = true` käme er nie durch. Der andere Weg, „Testnachricht
# an mein Gerät", schickt sehr wohl eines, und die Function fragt damit
# `push_devices` ab; ob das Token der Aufruferin gehört, entscheidet also
# die RLS. Beides steht im Kopf der Function ausgeschrieben.
[functions.send-push]
verify_jwt = false

[analytics]
enabled = false
