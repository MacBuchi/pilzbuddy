name: Rain Data

# Publishes the DWD rainfall sums as a compact value grid, so the app can
# draw contour lines in its own palette and answer "how much rain fell at
# this spot" without sending a coordinate anywhere. See tool/rain_grid.py.
# The station temperature table (tool/spot_weather.py) rides along on the
# daily run — same rule, same release, same manifest.
#
# Why its own workflow and not a passenger on feedback.yml: different
# cadence, and this one needs no secret at all — feedback.yml carries the
# service_role key, and nothing that does not need it should run beside it.
#
# The assets live on a FIXED tag (rain-data), not on a version tag: the
# data changes several times a day and the app does not. That also keeps
# the Version Guard out of it — no file in a binary changes here.
on:
  schedule:
    # RADOLAN-W4 (30 day sum) is published once a day around 05:50 UTC.
    - cron: "17 6 * * *"
    # SF-Produkt (rolling 24 h sum) is hourly; every three hours is plenty
    # for a number nobody watches minute by minute.
    - cron: "47 */3 * * *"
    # The daily stack behind the 14 day course at a spot. SF-Produkt_(0-24)
    # is a completed 00-24 UTC day, so it appears with roughly a day's lag
    # — the exact hour does not matter, and a run that finds nothing new
    # simply carries the manifest over. A missed day is caught by the next
    # run, because the tool always takes the last 14 the service offers.
    # The station temperature table rides on this run: its newest row is
    # also yesterday (CDC updates around 08:30 UTC+2), so one cadence
    # fits both.
    - cron: "23 7 * * *"
    # The Alpine model grid a second time (#612). One run fetches ONE
    # window (~3 900 points eat the 4 500 budget), and in the run above
    # that window is always yesterday — an older gap never got a turn,
    # and the stack sat at 12 of 28 days (2026-09-26…30), the Ampel grey
    # outside Germany. This run finds yesterday done and spends its
    # window on the gap; with nothing missing it calls nothing. Two
    # fetches a day stay under Open-Meteo's 10 000; the tool skips the
    # fetch while the last one is under an hour old (the cron above can
    # be hours late).
    - cron: "41 18 * * *"
    # The measured Alpine stack (#646) rides on both model runs: it
    # blends the model in, and MeteoSwiss publishes day D only at D+1
    # 12:17 UTC, so the evening run is the one that completes Switzerland.
    # Soil moisture from ERA5-Land (#676), its own run: it starts an
    # Open-Meteo container, which no other layer needs, and ERA5-Land
    # grows by one day a day with a five-day lag — any hour will do.
    - cron: "53 9 * * *"
  workflow_dispatch:
    inputs:
      layer:
        description: "Which layer to rebuild (empty = w4 and sf)"
        required: false
        type: choice
        options: ["", "w4", "sf", "daily", "weather", "model", "alps", "soil"]
        default: ""

# Never two runs at once — they would race on the shared manifest. Not
# cancel-in-progress: a half-finished run would leave the manifest naming
# a grid it never uploaded.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish rain grids
    runs-on: ubuntu-latest
    # The daily run now also walks two station networks (~900 small ZIPs,
    # sequential with retries) on top of the day grids.
    # The first run of the Alpine stack fetches and warps 3 x 30 days.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Self-test
        # Runs on every scheduled build, not just in CI on a pull request.
        # A helper that only ever runs against the live service is a
        # helper whose edge cases nobody has looked at since the day it
        # was written.
        run: |
          python3 tool/rain_grid.py --self-test
          python3 tool/spot_weather.py --self-test
          python3 tool/model_weather.py --self-test
          python3 tool/alps_rain.py --self-test
          python3 tool/soil_moisture.py --self-test

      - name: Pick layers
        id: pick
        # Über `env:` statt direkt interpoliert: `${{ }}` wird vor der Shell
        # ersetzt, der Wert stünde also als Code im Skript. Der Cron-String
        # kommt zwar aus dieser Datei selbst, `inputs.layer` aber von dem,
        # der den Lauf von Hand startet.
        env:
          SCHEDULE: ${{ github.event.schedule }}
          LAYER_INPUT: ${{ inputs.layer }}
        run: |
          case "$SCHEDULE" in
            "17 6 * * *") layers="w4" ;;
            "47 */3 * * *") layers="sf" ;;
            "23 7 * * *") layers="daily weather model alps" ;;
            "41 18 * * *") layers="model alps" ;;
            "53 9 * * *") layers="soil" ;;
            *) layers="$LAYER_INPUT" ;;
          esac
          [ -n "$layers" ] || layers="w4 sf"
          echo "layers=$layers" >> "$GITHUB_OUTPUT"
          echo "Building: $layers"

      - name: Fetch the current manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/rain
          # The two layers are built on different schedules, so a run must
          # merge into what is already published instead of replacing it.
          # Missing on the very first run — that is not an error.
          gh release download rain-data --pattern rain_manifest.json \
            --dir build/rain || echo "no manifest yet (first run)"

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for layer in ${{ steps.pick.outputs.layers }}; do
            if [ "$layer" = "weather" ]; then
              python3 tool/spot_weather.py --out build/rain
            elif [ "$layer" = "model" ]; then
              # The Alpine model grid (#612). AFTER weather: it appends its
              # lattice points to the station table of this run. A manual
              # run of "model" alone needs the table too — fetch it.
              if [ ! -f build/rain/weather_stations.json.gz ]; then
                gh release download rain-data --pattern weather_stations.json.gz \
                  --dir build/rain || echo "no station table yet"
              fi
              # And the PREVIOUS day files: the virtual stations carry 28
              # days of tmax/tmin, so the tool reads every day the manifest
              # lists, not only the ones this run fetches. The first run
              # had no previous days and passed; the first incremental run
              # failed on the missing files (2026-09-26).
              gh release download rain-data --pattern 'model_*' \
                --dir build/rain || echo "no model files yet (first run)"
              python3 tool/model_weather.py --out build/rain
            elif [ "$layer" = "soil" ]; then
              # Soil moisture 7–28 cm from ERA5-Land (#676), fetched from
              # a self-hosted Open-Meteo container (#631): ~9 800 points
              # would be two days of the public free tier. The container
              # reads the open S3 bucket on demand — no sync, no key.
              # Pinned by digest: the image lab run 25 measured against
              # (docs/pilzampel-openmeteo-lokal.md); a new one is a new
              # instrument and gets measured first.
              image="ghcr.io/open-meteo/open-meteo@sha256:e1517a01a061fd96e2a9017d022c5809bb51725bcd733bcbed435e7ea32dd9da"
              mkdir -p "$RUNNER_TEMP/open-meteo"
              docker run -d --name open-meteo -p 127.0.0.1:8080:8080 \
                -v "$RUNNER_TEMP/open-meteo:/app/data" \
                -e REMOTE_DATA_DIRECTORY=https://openmeteo.s3.amazonaws.com/data/ \
                -e CACHE_SIZE=2GB \
                "$image" serve --env production --hostname 0.0.0.0 --port 8080
              for i in $(seq 1 60); do
                curl -fs "http://127.0.0.1:8080/v1/archive?latitude=50&longitude=10&start_date=2026-01-01&end_date=2026-01-01&daily=soil_moisture_7_to_28cm_mean&models=era5_land" \
                  >/dev/null && break
                sleep 5
              done
              # The earlier days: verify reads the newest, which a run
              # that finds nothing new did not write.
              gh release download rain-data --pattern 'soil_*' \
                --dir build/rain || echo "no soil files yet (first run)"
              python3 tool/soil_moisture.py --out build/rain \
                --api http://127.0.0.1:8080/v1/archive --source "$image"
              docker logs --tail 20 open-meteo
            elif [ "$layer" = "alps" ]; then
              # The measured Alpine stack (#646), AFTER daily and model:
              # it blends both in. GDAL only reprojects (tool/alps_rain.py).
              command -v gdalwarp >/dev/null || {
                sudo apt-get update -qq
                sudo apt-get install -y -qq gdal-bin >/dev/null
              }
              # Day files of earlier runs, read but not re-uploaded: the
              # radar and model days the blend needs, and the national
              # days a changed input makes it blend again.
              mkdir -p build/inputs
              for pattern in 'rain_day_*' 'model_rain_*' 'at_rain_*' \
                             'ch_rain_*' 'it_rain_*'; do
                gh release download rain-data --pattern "$pattern" \
                  --dir build/inputs --skip-existing || true
              done
              python3 tool/alps_rain.py --out build/rain --inputs build/inputs
            else
              python3 tool/rain_grid.py --layer "$layer" --out build/rain
            fi
          done

      - name: Verify against the service
        # The guard against the one failure mode that is otherwise silent:
        # without subset=time(...) the WCS merges every granule and returns
        # roughly double the values, in a grid of the right size with a
        # plausible-looking median. Only asking the service what it says at
        # a given point exposes it.
        # The station table has no verify pass: its values come straight
        # out of the produkt files, and those files ARE the service's
        # answer — there is no second channel to cross-check against.
        run: |
          for layer in ${{ steps.pick.outputs.layers }}; do
            [ "$layer" = "weather" ] && continue
            if [ "$layer" = "alps" ]; then
              # Freshness per source, the blend's bounds on real data,
              # and INCA against GeoSphere's station grid SPARTACUS.
              python3 tool/alps_rain.py --verify --out build/rain \
                --inputs build/inputs
              continue
            fi
            if [ "$layer" = "soil" ]; then
              # Six random cells against the PUBLIC archive API — the
              # container is not asked to confirm itself.
              python3 tool/soil_moisture.py --verify --out build/rain
              continue
            fi
            if [ "$layer" = "model" ]; then
              # Six random lattice points, re-asked one by one: catches a
              # shifted lattice, swapped max/min, or a stale day file.
              python3 tool/model_weather.py --verify --out build/rain
              continue
            fi
            python3 tool/rain_grid.py --layer "$layer" --verify --out build/rain
          done

      # Everything below writes the release or its mirror — only from
      # main. A manual run on a branch (gh workflow run --ref) builds and
      # verifies, so a new layer can be timed on the real runner without
      # a branch publishing into what every app reads.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rain-data >/dev/null 2>&1 || \
            gh release create rain-data \
              --title "Regen-Gitter" \
              --notes "Wettergitter für PilzBuddy."
          # The notes name every source, and are rewritten each run so a
          # new layer cannot leave them behind (they said "DWD" alone
          # until the soil layer came, three sources later).
          gh release edit rain-data --notes "Wettergitter für PilzBuddy, mehrmals täglich überschrieben — die Beschreibung gehört zur Datenstrecke, nicht zu einer App-Version. Datenbasis: Deutscher Wetterdienst (GeoNutzV); GeoSphere Austria (CC BY 4.0); MeteoSchweiz (CC BY 4.0); Dipartimento della Protezione Civile (CC BY-SA 4.0); Open-Meteo (CC BY 4.0); enthält modifizierte Copernicus-Climate-Change-Service-Informationen (ERA5-Land, Bodenfeuchte)."
          # Only what this run actually built is in build/rain: the daily
          # stack carries unchanged days over without downloading them.
          gh release upload rain-data build/rain/* --clobber
          ls -la build/rain

      - name: Drop day files the stack no longer keeps
        # Without this the release grows by one file a day forever. The
        # list comes from the tool, not from a date-shaped glob here —
        # the tool is what decides how long the stack is.
        if: github.ref == 'refs/heads/main' && hashFiles('build/keep.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rain-data --json assets \
            --jq '.assets[].name' | grep '^rain_day_' > published.txt || true
          while read -r asset; do
            if ! grep -qx "$asset" build/keep.txt; then
              echo "Entferne $asset"
              gh release delete-asset rain-data "$asset" --yes
            fi
          done < published.txt
          echo "Im Stapel: $(wc -l < build/keep.txt) Tage"

      - name: Drop model files the Alpine stack no longer keeps
        # Same idea, own list and own prefix: `model_keep.txt` comes from
        # tool/model_weather.py and names rain, tmax, tmin and elevation.
        if: github.ref == 'refs/heads/main' && hashFiles('build/model_keep.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rain-data --json assets \
            --jq '.assets[].name' | grep '^model_' > published_model.txt || true
          while read -r asset; do
            if ! grep -qx "$asset" build/model_keep.txt; then
              echo "Entferne $asset"
              gh release delete-asset rain-data "$asset" --yes
            fi
          done < published_model.txt
          echo "Modellstapel: $(wc -l < build/model_keep.txt) Dateien"

      - name: Drop Alpine files the measured stack no longer keeps
        # Own list, five prefixes: the three national sources, the
        # blended days and their origin planes (tool/alps_rain.py).
        if: github.ref == 'refs/heads/main' && hashFiles('build/alps_keep.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rain-data --json assets --jq '.assets[].name' \
            | grep -E '^(at_rain|ch_rain|it_rain|alps_rain|alps_origin)_' \
            > published_alps.txt || true
          while read -r asset; do
            if ! grep -qx "$asset" build/alps_keep.txt; then
              echo "Entferne $asset"
              gh release delete-asset rain-data "$asset" --yes
            fi
          done < published_alps.txt
          echo "Alpenstapel: $(wc -l < build/alps_keep.txt) Dateien"

      - name: Drop soil files the stack no longer keeps
        # Own list, own prefix: `soil_keep.txt` from tool/soil_moisture.py.
        if: github.ref == 'refs/heads/main' && hashFiles('build/soil_keep.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rain-data --json assets \
            --jq '.assets[].name' | grep '^soil_' > published_soil.txt || true
          while read -r asset; do
            if ! grep -qx "$asset" build/soil_keep.txt; then
              echo "Entferne $asset"
              gh release delete-asset rain-data "$asset" --yes
            fi
          done < published_soil.txt
          echo "Bodenfeuchte: $(wc -l < build/soil_keep.txt) Tage"

      - name: Mirror the release into a branch the browser can read
        if: github.ref == 'refs/heads/main'
        # Release assets carry NO `access-control-allow-origin` header, so
        # a browser cannot fetch them at all — not even via the API, whose
        # 302 does carry CORS while the redirect target does not, and the
        # browser checks at the end. In the field this arrived as "the
        # Pilzampel has no rain data in the PWA" and "the rain map is not
        # smooth there" (#365, #366): without a grid the app silently
        # falls back to the hard DWD image.
        #
        # `raw.githubusercontent.com` does send `*`, but only for files on
        # a branch. So the finished release state is mirrored onto one.
        #
        # A ROOT commit per run, force-pushed: the branch keeps no history
        # nobody reads, and yesterday's objects fall out of reference.
        # Otherwise the repository would grow by ~2 MB several times a day.
        #
        # The branch is deliberately not named like the tag: a raw URL has
        # only one name slot, and with a tag and a branch of the same name
        # the service would decide which one it serves.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf build/mirror
          mkdir -p build/mirror
          # Every asset, not just the ones this run built: the layers are
          # built on different schedules, and the branch must show the
          # whole release, not the last slice of it.
          gh release download rain-data --dir build/mirror --clobber
          cd build/mirror
          git init -q
          git checkout -q --orphan rain-data-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mirror of release rain-data ($(date -u +%FT%TZ))"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            rain-data-mirror
          echo "Gespiegelt: $(find . -maxdepth 1 -type f | wc -l) Dateien"
