name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ohne diesen Block erbt jeder Job die Repo-Vorgabe — je nach Einstellung
# Schreibrechte auf Inhalte, Issues und Releases. Dieser Workflow braucht
# davon nichts: Er liest den Code, baut ihn und lädt Artefakte hoch
# (actions/upload-artifact kommt ohne contents:write aus). Die Rechte hier
# klein zu halten begrenzt den Schaden, den eine kompromittierte
# Third-Party-Action anrichten könnte — und in diesem Workflow laufen mit
# den Schema-Checks echte Datenbank-Zugangsdaten.
permissions:
  contents: read

# Ein Folge-Commit auf demselben Branch macht den laufenden Check wertlos —
# abbrechen statt parallel weiterlaufen lassen (spart vor allem den 6–7
# Minuten langen Android-Build).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Die einzigen Tests im Projekt, die wirklich auf dart2js laufen
      # (#385, #386). `flutter test` fährt sonst ausschließlich die Dart-VM,
      # wo `kIsWeb` immer falsch ist — jede Web-Verzweigung wäre damit
      # ungeprüft, auch wenn ein Testkommentar das Gegenteil behauptet
      # (genau so in #383 passiert). Es geht nur für assetfreien Code:
      # Der Chrome-Runner liefert keine Assets, ein `rootBundle.load`
      # endet dort im Timeout. Hier prüfen sie Zwischenspeicher und
      # Ausgangskorb gegen das echte IndexedDB des Browsers.
      - name: Web-Test auf dart2js
        run: |
          flutter test --platform chrome \
            test/spot_cache_idb_test.dart test/outbox_idb_test.dart
      # Die Skripte in tool/ hatten Selbsttests, aber niemanden, der sie
      # ausführt — sie wären still verrottet. Beide laufen ohne Netz,
      # ohne Schlüssel und in Sekunden.
      - name: Tool self-tests
        run: |
          python3 tool/feedback_bot.py --test-digest > /dev/null
          python3 tool/feedback_bot.py --test-insert "Violetter Lacktrichterling" > /dev/null
          python3 tool/symbolize_anr.py --self-test > /dev/null
          python3 tool/rain_grid.py --self-test > /dev/null
          python3 tool/spot_weather.py --self-test > /dev/null
          python3 tool/season_curves.py --self-test > /dev/null
          python3 tool/ampel_validate.py --self-test > /dev/null
          python3 tool/forest_grid.py --self-test > /dev/null
          python3 tool/forest_species.py --self-test > /dev/null
          python3 tool/elevation_grid.py --self-test > /dev/null
          python3 tool/release_notes.py --self-test > /dev/null
          python3 tool/generated_assets.py --self-test > /dev/null
          python3 tool/transform_map_style.py --self-test > /dev/null
          python3 tool/seed_screenshot_data.py --self-test > /dev/null
          python3 tool/screenshot_stand.py --self-test > /dev/null
          python3 tool/play_data_safety.py --check > /dev/null
      # Eigener Schritt, nicht bei den Selbsttests: Der hier prüft nicht
      # ein Werkzeug, sondern die ausgelieferten Dateien — und wenn er
      # rot wird, soll im Log sofort stehen, WELCHES Asset und wie man
      # es neu erzeugt (#226).
      - name: Erzeugte Assets sind frisch
        run: python3 tool/generated_assets.py --check > /dev/null

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      # `--no-web-resources-cdn` ist zweierlei zugleich (#387): Ohne den
      # Flag holt der Loader CanvasKit (~1,5 MB) von
      # www.gstatic.com — offline tot, und die IP jedes Besuchers ginge an
      # Google, bevor irgendetwas eingeschaltet wurde. Die Dateien liegen
      # ohnehin schon im Build, der Flag kostet also nichts.
      - run: flutter build web --release --base-href /pilzbuddy/ --no-web-resources-cdn
      # Der Service Worker ist die riskanteste Stelle der PWA: Er
      # entscheidet, ob die App ohne Netz startet, und ein Fehler darin
      # ist von außen unsichtbar — `flutter analyze` sieht die Datei
      # nicht, `flutter test` startet keinen Browser. Das Werkzeug fährt
      # einen echten Chrome gegen den gebauten Ordner und schaltet den
      # Webserver dabei WIRKLICH ab (#387).
      - name: Der Service Worker startet die App ohne Server
        run: node tool/check_service_worker.mjs build/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück —
      # für den CI-Kompilier-Check reicht das; signiert wird im Release-Workflow.
      #
      # Bewusst der `play`-Flavor, obwohl veröffentlicht die GitHub-APK wird:
      # `github` baut aus `src/main` und damit exakt wie vor den Flavors —
      # neu ist allein das Zusammenführen von `src/play/AndroidManifest.xml`.
      # Bricht das, soll es HIER auffallen und nicht in release.yml, wo der
      # Tag schon steht (die Lehre aus Mitfahrbars v0.34.1: ein Tag ohne
      # Release ist nur von Hand zu heilen). Dass release.yml die richtigen
      # Flavor-Namen nennt, prüft `test/release_build_test.dart`.
      - run: flutter build apk --release --flavor play
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-play
          path: build/app/outputs/flutter-apk/app-play-release.apk
          retention-days: 14

  # Probelauf VOR der Produktion: baut auf dem Runner einen lokalen
  # Supabase-Stack (supabase/config.toml, bewusst minimal) und stellt die
  # Frischinstallation exakt nach — schema.sql einspielen, dieselben
  # Patches mit demselben Skript obendrauf (beweist die Idempotenz, die
  # CLAUDE.md fordert), dann die App-Queries gegen das frische Schema.
  # Erst wenn das durchläuft, fasst schema-check die Live-DB an.
  schema-dry-run:
    name: Schema Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Für tool/patch_guard.sh und den Bestands-Pfad unten: beide
          # brauchen den Basis-Branch, nicht nur diesen einen Commit.
          fetch-depth: 0
      - name: Patch-Buchführung prüfen
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash tool/patch_guard.sh
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Wie lokal beim Betreiber — bei lokalem CLI-Upgrade mitziehen.
          version: 2.109.1
      - name: Lokalen Supabase-Stack starten
        run: supabase start
      # Pfad 1 — BESTANDSPROJEKT: der Stand des Basis-Branches, dann nur die
      # Patches dieses PRs obendrauf. Das ist der Weg, den die Produktion
      # nimmt; alles andere nimmt sie genau einmal im Leben. Der Schema Check
      # unten fasst danach die Live-DB an — hier fällt vorher auf, wenn ein
      # neuer Patch auf bestehendem Bestand nicht durchläuft (#123).
      - name: Basis-Schema einspielen (Stand des Ziel-Branches)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          git show "$BASE_REF:supabase/schema.sql" > /tmp/base_schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f /tmp/base_schema.sql
      - name: Neue Patches dieses PRs obendrauf
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tool/db_migrate.sh
      - name: App-Queries gegen den aufgerüsteten Bestand prüfen
        env:
          # Für die Aussperr-Grenze (#262): Der Check fragt den letzten
          # STABILEN Release-Stand ab. Ohne Token gilt auf geteilten
          # Runnern das IP-Limit der GitHub-API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_KEY=$(supabase status -o json | jq -r '.ANON_KEY') \
          bash tool/schema_check.sh
      # Pfad 2 — FRISCHINSTALLATION: alles weg, nur schema.sql. Beweist, dass
      # die Datei für sich vollständig ist. Genau das verdeckte der frühere
      # Aufbau: Weil dort die alten Patches erneut liefen, flickte ein
      # idempotenter Patch stillschweigend, was in schema.sql fehlte.
      # `db reset` statt handgeschriebenem DROP: Es stellt den Stack her, den
      # Supabase selbst anlegt (Rollen, auth-Schema, Grants). Ein eigenes
      # `drop schema public cascade` müsste die alle nachbauen und wäre die
      # Stelle, an der dieser Job irgendwann aus einem Grund scheitert, der
      # nichts mit dem Schema zu tun hat. Migrationen gibt es hier keine,
      # das Ergebnis ist also eine leere, frische Datenbank.
      - name: Datenbank auf null zurücksetzen
        run: supabase db reset
      - name: Nur schema.sql einspielen (Frischinstallation)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Nichts mehr offen (die Saat trägt die alten Patches)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tool/db_migrate.sh
      - name: App-Queries gegen das frische Schema prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_KEY=$(supabase status -o json | jq -r '.ANON_KEY') \
          bash tool/schema_check.sh
      # Registrierung und Reset sind die Flows, deren Kern außerhalb der
      # App liegt (Mail-Vorlagen, verifyOTP, Passwortänderung trotz
      # secure_password_change). Die Fakes können das nicht abdecken —
      # hier laufen sie gegen echtes GoTrue samt Mailabholung.
      - name: Auth-Mail-Flows end-to-end prüfen
        run: bash tool/auth_reset_check.sh

  # Spielt neue supabase/patch_NNN_*.sql direkt aus dem PR in die Live-DB
  # ein und prüft danach, ob alle App-Queries zum Live-Schema passen.
  # Pflicht-Check: ein PR, dessen Code neues Schema braucht, kann erst
  # gemergt werden, wenn der Patch wirklich in der Datenbank ist (#27).
  schema-check:
    name: Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Die Produktion wird erst angefasst, wenn der Aufbau von null
    # durchgelaufen ist — das ist der eigentliche Gewinn des Dry Runs.
    needs: schema-dry-run
    steps:
      - uses: actions/checkout@v7
        with:
          # Ohne die Historie kann db_migrate.sh nicht entscheiden, ob
          # DIESER PR einen Patch hinzufügt — und fiele dann auf die
          # vorsichtige Antwort „rot" zurück. Genau das passiert bei
          # Dependabot-PRs, denen GitHub die Actions-Secrets vorenthält.
          fetch-depth: 0
      - name: Neue DB-Patches einspielen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Über `env:` statt direkt in den `run:`-Block interpoliert —
          # dieselbe Begründung wie beim Version Guard weiter unten: Ein
          # Branch-Name ist von außen wählbar.
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash tool/db_migrate.sh
      - name: Live-Schema gegen die App-Queries prüfen
        run: bash tool/schema_check.sh

  housekeeping:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        # Über `env:` statt direkt in den `run:`-Block interpoliert: Ein
        # Branch-Name ist von außen wählbar, und `${{ }}` wird VOR der Shell
        # ersetzt — ein Branch namens `a";rm -rf /;#` würde sonst als Code
        # ausgeführt. In der Umgebungsvariable ist er nur noch eine
        # Zeichenkette. Beim Schema Dry Run oben steht es aus demselben
        # Grund schon so.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Version ist nicht größer als der letzte Tag → nur relevant,
            # wenn sich seither Nicht-Doku-Dateien geändert haben.
            # store/, tool/ und supabase/ sind ausgenommen, aus demselben
            # Grund: Store-Grafiken stecken in keiner Asset-Liste, die
            # Skripte in tool/ laufen nur in CI, und SQL/Stack-Config aus
            # supabase/ läuft in der Datenbank — nichts davon landet je in
            # einem Binary, soll also kein Release auslösen. (Ein Patch,
            # dessen Schema die App auch nutzt, ändert lib/ mit und bumpt
            # darüber.) Die Checks selbst (schema_check.sh, db_migrate.sh)
            # laufen davon unberührt weiter.
            #
            # CHANGELOG.md ist die Ausnahme von der *.md-Regel: Sie steht in
            # der Asset-Liste (pubspec.yaml) und wird als „Was ist neu" in
            # der App angezeigt — sie liegt also im Binary. Ohne diese
            # Ausnahme könnte man den ausgelieferten Text ändern, ohne dass
            # ein Release entsteht, und die App zeigte eine Liste, die zu
            # keiner veröffentlichten Version gehört. Ein zweites `git diff`
            # statt eines Pathspecs, weil Ausschlüsse in git immer gewinnen:
            # ein einmal per ':!*.md' ausgeschlossener Pfad lässt sich nicht
            # wieder hereinholen.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              range="origin/$BASE_REF...HEAD"
            else
              range="$latest..HEAD"
            fi
            changed=$(
              {
                git diff --name-only "$range" -- . ':!*.md' ':!.github' ':!store' ':!tool' ':!supabase' || true
                git diff --name-only "$range" -- CHANGELOG.md || true
              } | grep -v '^$' || true
            )
            if [ -n "$changed" ]; then
              # Blockiert den Merge (Pflicht-Check): Code-Änderungen brauchen
              # immer einen Versions-Bump, sonst entsteht kein Release.
              # Reine Doku (*.md außer CHANGELOG.md), .github/, store/ und
              # tool/ sind ausgenommen.
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 1.2.3+4 → 1.2.4+5) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
