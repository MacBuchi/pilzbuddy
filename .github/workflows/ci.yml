name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein Folge-Commit auf demselben Branch macht den laufenden Check wertlos —
# abbrechen statt parallel weiterlaufen lassen (spart vor allem den 6–7
# Minuten langen Android-Build).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /pilzbuddy/
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück —
      # für den CI-Kompilier-Check reicht das; signiert wird im Release-Workflow.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Probelauf VOR der Produktion: baut auf dem Runner einen lokalen
  # Supabase-Stack (supabase/config.toml, bewusst minimal) und stellt die
  # Frischinstallation exakt nach — schema.sql einspielen, dieselben
  # Patches mit demselben Skript obendrauf (beweist die Idempotenz, die
  # CLAUDE.md fordert), dann die App-Queries gegen das frische Schema.
  # Erst wenn das durchläuft, fasst schema-check die Live-DB an.
  schema-dry-run:
    name: Schema Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          # Wie lokal beim Betreiber — bei lokalem CLI-Upgrade mitziehen.
          version: 2.109.1
      - name: Lokalen Supabase-Stack starten
        run: supabase start
      - name: schema.sql einspielen (Frischinstallation)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Patches obendrauf einspielen (Idempotenz-Beweis)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tool/db_migrate.sh
      - name: App-Queries gegen das frische Schema prüfen
        run: |
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_KEY=$(supabase status -o json | jq -r '.ANON_KEY') \
          bash tool/schema_check.sh
      # Der Reset ist der einzige Flow, dessen Kern außerhalb der App liegt
      # (Mail-Vorlage, verifyOTP, Passwortänderung trotz
      # secure_password_change). Die Fakes können das nicht abdecken —
      # hier läuft er gegen echtes GoTrue samt Mailabholung.
      - name: Passwort-Reset end-to-end prüfen
        run: bash tool/auth_reset_check.sh

  # Spielt neue supabase/patch_NNN_*.sql direkt aus dem PR in die Live-DB
  # ein und prüft danach, ob alle App-Queries zum Live-Schema passen.
  # Pflicht-Check: ein PR, dessen Code neues Schema braucht, kann erst
  # gemergt werden, wenn der Patch wirklich in der Datenbank ist (#27).
  schema-check:
    name: Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Die Produktion wird erst angefasst, wenn der Aufbau von null
    # durchgelaufen ist — das ist der eigentliche Gewinn des Dry Runs.
    needs: schema-dry-run
    steps:
      - uses: actions/checkout@v7
      - name: Neue DB-Patches einspielen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash tool/db_migrate.sh
      - name: Live-Schema gegen die App-Queries prüfen
        run: bash tool/schema_check.sh

  housekeeping:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Version ist nicht größer als der letzte Tag → nur relevant,
            # wenn sich seither Nicht-Doku-Dateien geändert haben.
            # store/, tool/ und supabase/ sind ausgenommen, aus demselben
            # Grund: Store-Grafiken stecken in keiner Asset-Liste, die
            # Skripte in tool/ laufen nur in CI, und SQL/Stack-Config aus
            # supabase/ läuft in der Datenbank — nichts davon landet je in
            # einem Binary, soll also kein Release auslösen. (Ein Patch,
            # dessen Schema die App auch nutzt, ändert lib/ mit und bumpt
            # darüber.) Die Checks selbst (schema_check.sh, db_migrate.sh)
            # laufen davon unberührt weiter.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- . ':!*.md' ':!.github' ':!store' ':!tool' ':!supabase' || true)
            else
              changed=$(git diff --name-only "$latest"..HEAD -- . ':!*.md' ':!.github' ':!store' ':!tool' ':!supabase' || true)
            fi
            if [ -n "$changed" ]; then
              # Blockiert den Merge (Pflicht-Check): Code-Änderungen brauchen
              # immer einen Versions-Bump, sonst entsteht kein Release.
              # Reine Doku (*.md), .github/, store/ und tool/ sind ausgenommen.
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 1.2.3+4 → 1.2.4+5) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
