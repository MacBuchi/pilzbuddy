name: Database Backup

# Weekly encrypted dump of the live Supabase database into the private
# backup repository. The free plan has no point-in-time recovery and no
# automatic dumps — without this there is no way back from a bad migration.
#
# Run it manually before any larger migration (workflow_dispatch).
# `dry_run` dumps, verifies and encrypts without uploading — useful to test
# the job itself without touching the backup store.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dump and encrypt, but do not upload"
        type: boolean
        default: false

# Zwei gleichzeitige Dumps wären nur Last ohne Nutzen. Nicht abbrechen:
# ein halb hochgeladenes Backup ist die schlechtere Variante.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Der Runner bringt einen älteren Client mit; ist pg_dump älter als
      # der Server, bricht es mit "server version mismatch" ab.
      - name: PostgreSQL-Client und age installieren
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          pg_dump --version
          age --version

      - name: Dump ziehen, prüfen, verschlüsseln und ablegen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Fein granulares PAT, nur contents:write auf das Backup-Repo.
          # Bewusst NICHT der GITHUB_TOKEN: der gilt nur für dieses Repo.
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash tool/db_backup.sh --no-upload
          else
            bash tool/db_backup.sh
          fi
