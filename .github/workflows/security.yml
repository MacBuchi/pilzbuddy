name: Security

# Schwachstellen-Scan über die Lockfiles (OSV-Datenbank).
#
# Der Lauf hat ZWEI Gesichter, und der Unterschied ist der ganze Punkt:
#
# 1. „OSV (PR)" scannt Ziel-Branch UND PR-Stand und meldet nur, was DIESER
#    PR neu einführt. Er darf deshalb blockieren (Pflicht-Check): Eine
#    frisch veröffentlichte CVE in einer transitiven Abhängigkeit kann ihn
#    konstruktionsbedingt nicht rot färben — sie steht auf beiden Seiten
#    des Vergleichs.
# 2. „OSV (wöchentlich)" scannt den Gesamtbestand. Er ist bewusst KEIN
#    Pflicht-Check und hängt an keinem PR: Genau dort würde eine alte CVE
#    ohne verfügbaren Fix jeden unbeteiligten PR blockieren, bis jemand
#    aufräumt. Als Wochenlauf meldet GitHub den Fehlschlag per Mail an den
#    Maintainer — das passt zum Solo-Betrieb und hält niemanden auf.
#
# Ergänzt Dependabot statt es zu ersetzen: Dependabot kann für `pub` auch
# Sicherheits-Updates, zieht seine Funde aber aus der GitHub Advisory
# Database, die für Dart dünn besetzt ist. OSV.dev führt deutlich mehr.
#
# `-r ./` bleibt als Standardargument stehen: Der Scanner findet
# pubspec.lock selbst.

on:
  schedule:
    - cron: "17 5 * * 1" # montags früh
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # Für den SARIF-Upload nach Security → Code Scanning (im öffentlichen Repo
  # kostenlos). Die aufgerufenen Workflow-Dateien fordern genau diese drei an.
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pflicht-Check. Nur neu eingeführte Funde, siehe Kopf.
  osv-scan-pr:
    name: OSV (PR)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

  # Berichtend, nie blockierend, siehe Kopf.
  osv-scan-full:
    name: OSV (wöchentlich)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

  # Der Schwachstellen-Riegel für die im PR NEU hinzukommenden
  # Abhängigkeiten (GitHubs Dependency Graph wertet pubspec.yaml +
  # pubspec.lock aus — Dart wird unterstützt, die Lockfile ist eingecheckt).
  #
  # **Hier steht bewusst KEINE Lizenzregel** (weder deny noch allow, #265).
  # Sobald irgendeine gesetzt ist, prüft die Action die SPDX-Kennung JEDER
  # gemeldeten Lizenz — und GitHubs Dependency Graph meldet pub-Lizenzen
  # kleingeschrieben (`mit`, `bsd-3-clause`). Das sind keine gültigen
  # SPDX-Kennungen, also bricht der Job ab: „Dependency review could not
  # detect the validity of all licenses." Jede Abhängigkeits-PR wäre damit
  # rot, dauerhaft. In MitFahrBar an derselben Paket-Änderung in beide
  # Richtungen gemessen (dort #226/#227): rot mit Liste, grün in 7 s ohne.
  # Es liegt nicht an der Action-Version — ein v4-Lauf starb genauso.
  #
  # Verloren geht dabei nichts: Die Lizenzen prüft `Lizenzen
  # (Gesamtbestand)` unten, und zwar strenger — als ALLOW-Liste, über alle
  # ~174 Pakete statt nur die neuen, aus den echten LICENSE-Dateien statt
  # aus Metadaten Dritter.
  #
  # Wer hier wieder eine Zeile `deny-licenses:` einfügt, holt genau diesen
  # Dauerfehler zurück.
  #
  # **VORBEDINGUNG, und sie ist eine Repo-Einstellung, kein Code:** Der
  # Dependency Graph muss unter Settings → Code security eingeschaltet sein
  # (https://github.com/MacBuchi/pilzbuddy/settings/security_analysis).
  # Ist er aus, bricht dieser Job binnen Sekunden ab mit „Dependency review
  # is not supported on this repository" — so geschehen im ersten Lauf von
  # PR #223. Das sieht nach einem kaputten Workflow aus und ist keiner.
  # Code Scanning kann dabei durchaus schon an sein: Der SARIF-Upload von
  # OSV lief im selben Lauf durch.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # **Der einzige Lizenz-Check** (seit #265, siehe oben: In
  # `dependency-review` kann keiner stehen, ohne dort jede
  # Abhängigkeits-PR rot zu machen). Prüft den GANZEN Baum, nicht nur was
  # ein PR neu hinzufügt — ein Lizenzwechsel in einer bestehenden
  # transitiven Abhängigkeit fiele sonst nie auf. Regeln und
  # Begründungen in tool/license_config.yaml.
  #
  # `dart pub global activate` statt dev_dependency: `pubspec.yaml` ist
  # nicht vom Version Guard ausgenommen, eine Zeile dort löste ein Release
  # an die Nutzer aus, nur um einen Linter zu installieren.
  #
  # **Blockierend, und das ist eine Korrektur.** Ursprünglich stand hier
  # `continue-on-error` mit der Begründung, ein Dependabot-PR mit einer
  # unlesbaren Lizenz solle nicht gleich den Merge sperren. Der erste echte
  # Lauf hat die Begründung widerlegt — und zwar teuer: Der Aufruf war
  # falsch (`license_checker:lic_ck`; `lic_ck` ist der Name der
  # INSTALLIERTEN Binärdatei, `dart pub global run` will aber den
  # SKRIPTnamen, und der ist `license_checker`). Das Werkzeug brach mit
  # Exit 66 ab, und `continue-on-error` machte daraus einen grünen Haken.
  # Ein Check, der Erfolg meldet, ohne etwas geprüft zu haben, ist
  # schlechter als gar keiner.
  #
  # Die Konfiguration ist gegen alle 174 Pakete abgestimmt und rot
  # verifiziert; sie darf blockieren. Ein neues Paket mit unlesbarer Lizenz
  # macht CI dann rot und wird mit einem **nachgesehenen** Override in
  # tool/license_config.yaml beantwortet — das ist der vorgesehene Ablauf,
  # nicht der Ausnahmefall.
  licenses:
    name: Lizenzen (Gesamtbestand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      # Die Pakete müssen im Cache liegen: Das Werkzeug liest die echten
      # LICENSE-Dateien, nicht irgendwelche Metadaten.
      - run: flutter pub get
      - run: dart pub global activate license_checker
      # `paket:skript`, NICHT `paket:binärname` — siehe Kopf.
      - name: Lizenzen prüfen
        run: dart pub global run license_checker:license_checker -c tool/license_config.yaml check-licenses
