name: Release

# Zwei Wege zum Release (Muster wie in durecmix/FWApp):
#  - Push eines Tags v* baut und veröffentlicht genau diesen Stand.
#  - Push auf main: steht in pubspec.yaml eine Version ohne passenden Tag,
#    wird v<version> automatisch getaggt und released. Kein Bump = kein Release.
#
# **Alles hier ist ein PRERELEASE** (#262). Am 2026-08-09 gingen acht
# Releases an einem Tag raus — und weil jedes „latest" war, meldete sich
# der Update-Hinweis achtmal. `update_check.dart` fragt
# `/releases/latest` ab, und GitHub liefert dort grundsätzlich keine
# Prereleases: Damit trennt diese eine Markierung die Kanäle, ohne
# zweiten Dauerbranch, ohne Rück-Merges, ohne doppelten Branch-Schutz.
# Freigegeben wird von Hand über `promote.yml` — dort liegt seither auch
# der Pages-Deploy, denn das Web hat nur EINE Adresse.
on:
  push:
    branches: [main]
    tags: ["v*"]

# Releases nacheinander, aber NIEMALS abbrechen: ein mittendrin gekappter
# Lauf hinterlässt einen gepushten Tag ohne APK und ohne Web-Deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag existiert schon — kein neues Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Sicherheitsnetz: normalerweise spielt schon der Pflicht-Check im PR
  # neue DB-Patches ein (ci.yml, "Schema Check"). Vor dem Veröffentlichen
  # wird hier trotzdem migriert (idempotent über public.applied_patches)
  # und das Live-Schema erneut gegen die App-Queries geprüft — eine App,
  # deren Queries auf der Live-DB scheitern, wird nie ausgeliefert.
  migrate:
    name: DB-Patches & Schema Check
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: DB-Patches einspielen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash tool/db_migrate.sh
      - name: Live-Schema gegen die App-Queries prüfen
        run: bash tool/schema_check.sh

  build-android:
    name: Build Android APK + AAB (signed)
    needs: [version, migrate]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Write signing config
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 fehlt — es wird keine debug-signierte Release-APK veröffentlicht."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/pilzbuddy-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=pilzbuddy-release.jks
          EOF
      # Nur arm64: Alle bekannten Zielgeräte sind arm64, und die
      # Universal-APK würde mit der MapLibre-Engine (libmaplibre.so,
      # 12,7 MB je ABI) um ~36 MB wachsen. Ohne die beiden ungenutzten
      # ABIs wird die APK sogar kleiner als bisher. Das AAB unten bleibt
      # universal — Play splittet selbst pro Gerät.
      #
      # `disable-abi-filtering` gehört zwingend dazu: Ohne den Schalter
      # setzt der Flutter-Gradle-Plugin die ABI-Filter selbst — und zwar
      # per `abiFilters.clear()` auf ALLE drei (FlutterPlugin.kt,
      # configureAbiWithoutSplits), womit auch ein in build.gradle.kts
      # gesetzter Filter wieder weg wäre. `--target-platform` allein
      # beschränkt nur Flutters eigene Artefakte; die nativen Teile der
      # Plugins kamen weiter für alle ABIs mit. In 1.43.0 waren das
      # 22,4 MB von 66,8 MB — nicht startfähig, weil dazu die passende
      # libflutter.so fehlt. `test/release_build_test.dart` hält beide
      # Schalter zusammen.
      #
      # `--flavor github` behält REQUEST_INSTALL_PACKAGES: Genau dieser Weg
      # aktualisiert sich selbst aus dem GitHub-Release.
      - run: >
          flutter build apk --release
          --flavor github
          --target-platform android-arm64
          -Pdisable-abi-filtering=true
      - name: Artefakt benennen
        run: cp build/app/outputs/flutter-apk/app-github-release.apk "pilzbuddy-${{ needs.version.outputs.tag }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: pilzbuddy-${{ needs.version.outputs.tag }}.apk
      # AAB für den Play Store — dasselbe Signing wie die APK. Bewusst NICHT
      # am GitHub-Release: ein .aab lässt sich nicht installieren und würde
      # neben der APK nur verwirren. Liegt als Workflow-Artefakt bereit.
      #
      # PLAY_BUILD=true blendet den Update-Hinweis aus: im Store aktualisiert
      # Play selbst, und Nutzer zu APK-Downloads zu schicken wäre dort ein
      # Richtlinienverstoß. Die APK oben wird ohne das Flag gebaut und behält
      # den Hinweis.
      #
      # `--flavor play` gehört zwingend dazu: Es ist die andere Hälfte
      # derselben Entscheidung. Ohne das Flag bliebe der Dart-Pfad zwar aus,
      # REQUEST_INSTALL_PACKAGES stünde aber im AAB — eine Berechtigung ohne
      # Funktion, und genau daran scheitern Play-Reviews.
      - run: >
          flutter build appbundle --release
          --flavor play
          --dart-define=PLAY_BUILD=true
      - name: Bundle benennen
        run: cp build/app/outputs/bundle/playRelease/app-play-release.aab "pilzbuddy-${{ needs.version.outputs.tag }}.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: pilzbuddy-${{ needs.version.outputs.tag }}.aab
          retention-days: 90
      # Direkt in den internen Test-Track der Play Console (Betreiber,
      # 2026-08-13: das AAB nie wieder von Hand anfassen). Ein Draft-
      # Release, KEINE Veröffentlichung: sichtbar wird ein Stand erst,
      # wenn ihn jemand in der Console freigibt — dieselbe Trennung wie
      # bei Prerelease und promote.yml.
      #
      # Braucht das Repo-Secret PLAY_SERVICE_ACCOUNT_JSON (Dienstkonto
      # mit Play-API-Zugriff, Anleitung in docs/play-console.md). Es kann
      # ERST existieren, nachdem der App-Eintrag einmal von Hand angelegt
      # und das erste AAB hochgeladen wurde — die Play-API kann keine
      # Apps anlegen, und Play akzeptiert API-Uploads erst danach.
      # Fehlt es, wird sichtbar übersprungen (Muster deploy-functions.yml):
      # Ein Job, der bis dahin rot würde, wäre bei jedem Bump falscher
      # Alarm.
      # Der `secrets`-Kontext ist in `if:` NICHT verfügbar — GitHub
      # verwirft die ganze Datei dann schon beim Einlesen („workflow file
      # issue", null Jobs), und zwar bei JEDEM Push, weil nicht einmal
      # die Filter ausgewertet werden. Genau so hat dieses Muster
      # deploy-functions.yml von seiner Erstellung an lahmgelegt und den
      # Release-Build für 1.91.1 verhindert, bevor es hier auffiel.
      # Deshalb der Umweg: ein Schritt stellt das Vorhandensein fest
      # (Secrets in `env:` sind erlaubt), die anderen prüfen sein
      # Ergebnis — der `steps`-Kontext ist in `if:` verfügbar.
      - name: Play-Secret vorhanden?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "have=$([ -n "$SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload to Play internal testing
        if: steps.play.outputs.have == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.mcbuchi.pilzbuddy
          releaseFiles: pilzbuddy-${{ needs.version.outputs.tag }}.aab
          track: internal
          status: draft
      - name: Play-Upload übersprungen
        if: steps.play.outputs.have == 'false'
        run: |
          {
            echo "### Nicht zu Play hochgeladen — \`PLAY_SERVICE_ACCOUNT_JSON\` fehlt"
            echo ""
            echo "Das AAB liegt als Artefakt \`android-aab\` an diesem Lauf."
            echo "Einrichtung (einmalig, NACH dem ersten Hand-Upload):"
            echo "docs/play-console.md, Abschnitt „AAB-Upload aus CI\"."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [version, build-android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: pilzbuddy-*.apk
          # BEIDE Zeilen gehören zusammen: `prerelease` allein genügt
          # nicht, GitHub markiert das neueste Release sonst trotzdem als
          # „latest" — und die App fragt genau das ab.
          # `test/release_workflow_test.dart` wacht darüber.
          prerelease: true
          make_latest: false
